name: edidada CI (BusTub)

on:
  push:
    branches:
      - edidada/master
  workflow_dispatch:

env:
  BUILD_TYPE: Debug

jobs:
  build-and-test:
    name: "Build and run lab tests"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-18 clang++-18

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18

      - name: "Build (P1 + P2 tests)"
        run: |
          cmake --build build -j"$(nproc)" --target bustub
          cmake --build build -j"$(nproc)" --target \
            lru_k_replacer_test arc_replacer_test buffer_pool_manager_test \
            page_guard_test disk_scheduler_test \
            b_plus_tree_insert_test b_plus_tree_delete_test \
            b_plus_tree_concurrent_test b_plus_tree_sequential_scale_test \
            extendible_htable_test extendible_htable_concurrent_test \
            extendible_htable_page_test

      - name: "P1: LRU-K replacer"
        run: ctest --test-dir build --output-on-failure -R "LRUKReplacerTest"

      - name: "P1: ARC replacer"
        run: ctest --test-dir build --output-on-failure -R "ArcReplacerTest"

      - name: "P1: disk scheduler"
        run: ctest --test-dir build --output-on-failure -R "DiskSchedulerTest"

      - name: "P1: page guards"
        run: ctest --test-dir build --output-on-failure -R "PageGuardTest"

      - name: "P1: buffer pool manager"
        run: ctest --test-dir build --output-on-failure -R "BufferPoolManagerTest"

      - name: "P2: B+Tree insert and scan"
        run: ctest --test-dir build --output-on-failure -R "BPlusTreeTests\.(BasicInsertTest|InsertTest1NoIterator|InsertTest2)\b"

      - name: "P2: B+Tree delete"
        run: ctest --test-dir build --output-on-failure -R "DeleteTestNoIterator|SequentialEdgeMixTest"

      - name: "P2: B+Tree concurrent"
        run: ctest --test-dir build --output-on-failure -R "BPlusTreeConcurrentTest"

      - name: "P2: B+Tree scale"
        run: ctest --test-dir build --output-on-failure -R "BasicScaleTest"

      - name: "P2: extendible hash table pages"
        run: ctest --test-dir build --output-on-failure -R "BucketPageSampleTest|HeaderDirectoryPageSampleTest"

      - name: "P2: extendible hash table"
        run: ctest --test-dir build --output-on-failure -R "ExtendibleHTableTest\.(InsertTest2|RemoveTest1)"

      - name: "P2: extendible hash table concurrent"
        run: ctest --test-dir build --output-on-failure -R "ExtendibleHTableConcurrentTest"

      - name: "P3: build sqllogictest"
        run: cmake --build build -j"$(nproc)" --target sqllogictest

      - name: "P3: primer"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.00-primer.slt --verbose -d --in-memory

      - name: "P3: seq scan"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.01-seqscan.slt --verbose -d --in-memory

      - name: "P3: insert"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.02-insert.slt --verbose -d --in-memory

      - name: "P3: update"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.03-update.slt --verbose -d --in-memory

      - name: "P3: delete"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.04-delete.slt --verbose -d --in-memory

      - name: "P3: sort and limit"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.16-sort-limit.slt --verbose -d --in-memory

      - name: "P3: repeat execute"
        run: ./build/bin/bustub-sqllogictest test/sql/p3.12-repeat-execute.slt --verbose -d --in-memory
